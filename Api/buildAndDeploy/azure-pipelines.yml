trigger:
  branches:
    include:
      - main
  paths:
    include:
      - Api/src/**
      - Api/buildAndDeploy/**

variables:
  buildConfiguration: Release
  apiProject: Api/src/Api/Api.csproj

stages:
  - stage: Build
    displayName: Build and publish API
    jobs:
      - job: BuildApi
        displayName: Build API
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseDotNet@2
            displayName: Install .NET 8 SDK
            inputs:
              packageType: sdk
              version: 8.x

          - script: dotnet restore "$(apiProject)"
            displayName: Restore API dependencies

          - script: dotnet build "$(apiProject)" --configuration "$(buildConfiguration)" --no-restore
            displayName: Build API

          - script: dotnet publish "$(apiProject)" --configuration "$(buildConfiguration)" --no-build --no-restore --output "$(Build.ArtifactStagingDirectory)/publish"
            displayName: Publish API

          - task: ArchiveFiles@2
            displayName: Package API for App Service
            inputs:
              rootFolderOrFile: $(Build.ArtifactStagingDirectory)/publish
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/api.zip
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1
            displayName: Publish API artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/api.zip
              artifact: api
              publishLocation: pipeline

  - stage: Deploy_DEV
    displayName: Deploy to DEV
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    dependsOn: Build
    jobs:
      - deployment: DeployApi_DEV
        displayName: Deploy API to DEV
        environment: DEV
        pool:
          vmImage: ubuntu-latest
        variables:
          - group: Api-DEV
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: api
                - task: AzureWebApp@1
                  displayName: Deploy API to DEV App Service
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: $(appType)
                    appName: $(webAppName)
                    package: $(Pipeline.Workspace)/api/api.zip
                    appSettings: |
                      -ConnectionStrings__DefaultConnection "$(ConnectionString)"
                      -Jwt__Key "$(JwtKey)"
                      -Jwt__Issuer "$(JwtIssuer)"
                      -Jwt__Audience "$(JwtAudience)"

  - stage: Deploy_QA
    displayName: Deploy to QA
    dependsOn: Deploy_DEV
    condition: succeeded()
    jobs:
      - deployment: DeployApi_QA
        displayName: Deploy API to QA
        environment: QA
        pool:
          vmImage: ubuntu-latest
        variables:
          - group: Api-QA
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: api
                - task: AzureWebApp@1
                  displayName: Deploy API to QA App Service
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: $(appType)
                    appName: $(webAppName)
                    package: $(Pipeline.Workspace)/api/api.zip
                    appSettings: |
                      -ConnectionStrings__DefaultConnection "$(ConnectionString)"
                      -Jwt__Key "$(JwtKey)"
                      -Jwt__Issuer "$(JwtIssuer)"
                      -Jwt__Audience "$(JwtAudience)"

  - stage: Deploy_PROD
    displayName: Deploy to PROD
    dependsOn: Deploy_QA
    condition: succeeded()
    jobs:
      - deployment: DeployApi_PROD
        displayName: Deploy API to PROD
        environment: PROD
        pool:
          vmImage: ubuntu-latest
        variables:
          - group: Api-PROD
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: api
                - task: AzureWebApp@1
                  displayName: Deploy API to PROD App Service
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: $(appType)
                    appName: $(webAppName)
                    package: $(Pipeline.Workspace)/api/api.zip
                    appSettings: |
                      -ConnectionStrings__DefaultConnection "$(ConnectionString)"
                      -Jwt__Key "$(JwtKey)"
                      -Jwt__Issuer "$(JwtIssuer)"
                      -Jwt__Audience "$(JwtAudience)"
